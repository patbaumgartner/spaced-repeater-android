---
name: Bug report
description: Report reproducible incorrect behavior.
title: 'bug: '
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private decks, or learner data.
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include sanitized logs or screenshots only.
